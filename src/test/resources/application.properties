# All tests use an isolated in-memory database, never the developer's PostgreSQL database.
spring.datasource.url=jdbc:h2:mem:proyTicTest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

# Keep automated tests isolated from external services and preserve deterministic seed data.
app.demo-users.enabled=true
spring.mail.host=
spring.mail.username=
spring.mail.password=
app.mail.from=
app.stripe.secret-key=
app.stripe.webhook-secret=
