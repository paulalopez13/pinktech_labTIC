spring.application.name=proyTic2026
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/uruguaymnatural}
spring.datasource.username=${DATABASE_USERNAME:uruguaymnatural}
spring.datasource.password=${DATABASE_PASSWORD:uruguaymnatural_dev}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=68MB
# Administrador inicial independiente de las cuentas de demostración. No se borra
# al desactivar los usuarios demo y se recrea si falta en la base de datos.
app.initial-admin.enabled=true
app.initial-admin.username=${APP_INITIAL_ADMIN_USERNAME:admin.inicial}
app.initial-admin.email=${APP_INITIAL_ADMIN_EMAIL:admin.inicial@uruguaymnatural.uy}
app.initial-admin.password=${APP_INITIAL_ADMIN_PASSWORD:AdminUruguay2026!}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${SMTP_FROM:}
app.frontend-url=${APP_FRONTEND_URL:http://127.0.0.1:5173}
app.password-reset.frontend-url=${APP_FRONTEND_URL:http://127.0.0.1:5173}
app.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
app.stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
spring.config.import=optional:file:.env[.properties]
