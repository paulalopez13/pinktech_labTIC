services:
  postgres:
    image: postgres:17-alpine
    container_name: uruguaymnatural-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-uruguaymnatural}
      POSTGRES_USER: ${POSTGRES_USER:-uruguaymnatural}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uruguaymnatural_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uruguaymnatural} -d ${POSTGRES_DB:-uruguaymnatural}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
